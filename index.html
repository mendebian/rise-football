<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise Football</title>
    <link rel="icon" type="image/png" href="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/rise.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#1a1a1a',
                        accent: '#333333',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }

        .home-screen {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #333333 100%);
        }

        .logo-icon {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Custom Dropdown Styles */
        .custom-select {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .custom-select-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            width: 100%;
            justify-content: space-between;
            min-height: 38px;
        }

        .custom-select-button:hover {
            border-color: #ccc;
            background: #f5f5f5;
        }

        .custom-select-button.open {
            border-color: #000;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .custom-select-button img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .custom-select-button i {
            font-size: 14px;
            flex-shrink: 0;
        }

        .custom-select-button .arrow {
            font-size: 10px;
            transition: transform 0.2s;
            color: #999;
        }

        .custom-select-button .arrow.open {
            transform: rotate(180deg);
        }

        .custom-select-button .selected-content {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            overflow: hidden;
        }

        .custom-select-button .selected-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-select-dropdown {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .custom-select-dropdown.open {
            display: block;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            color: #333;
            font-size: 13px;
        }

        .custom-option:hover {
            background: #f5f5f5;
        }

        .custom-option.selected {
            background: #f0f0f0;
            font-weight: 600;
        }

        .custom-option img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .custom-option i {
            font-size: 14px;
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }

        .custom-option .check {
            margin-left: auto;
            color: #000;
        }

        /* Language Selector Custom */
        .language-selector {
            position: relative;
            display: inline-block;
        }

        .language-selector-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-size: 14px;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
            min-width: 140px;
            justify-content: space-between;
        }

        .language-selector-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .language-selector-button img {
            width: 24px;
            height: 18px;
            object-fit: cover;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .language-selector-button .arrow {
            font-size: 10px;
            transition: transform 0.2s;
        }

        .language-selector-button .arrow.open {
            transform: rotate(180deg);
        }

        .language-selector-dropdown {
            position: absolute;
            top: calc(100% + 5px);
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            min-width: 180px;
            z-index: 100;
            display: none;
            overflow: hidden;
        }

        .language-selector-dropdown.open {
            display: block;
            animation: fadeIn 0.2s;
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            color: #333;
            font-size: 14px;
        }

        .language-option:hover {
            background: #f5f5f5;
        }

        .language-option.selected {
            background: #f0f0f0;
            font-weight: 600;
        }

        .language-option img {
            width: 24px;
            height: 18px;
            object-fit: cover;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .language-option .check {
            margin-left: auto;
            color: #000;
        }

        .team-shield img {
            object-fit: contain;
        }

        .field-zone-home, .field-zone-away {
            transition: all 0.3s ease;
        }

        .field-divider-line {
            transition: left 0.3s ease;
        }

        .neutral-toggle input[type="checkbox"] {
            width: 36px;
            height: 18px;
            appearance: none;
            background: #e0e0e0;
            border-radius: 9px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .neutral-toggle input[type="checkbox"]:checked {
            background: #000000;
        }

        .neutral-toggle input[type="checkbox"]::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .neutral-toggle input[type="checkbox"]:checked::before {
            left: 20px;
        }

        .toast {
            animation: slideInRight 0.2s ease-out;
            border-left: 3px solid #000000;
        }

        .toast.success { border-left-color: #4ecca3; }
        .toast.error { border-left-color: #ff6b6b; }
        .toast.warning { border-left-color: #f9a826; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .tab-content {
            display: none !important;
        }

        .tab-content.active {
            display: block !important;
            animation: fadeIn 0.3s;
        }

        .control-btn.active {
            background: #000000 !important;
            color: #ffffff !important;
            border-color: #000000 !important;
        }

        .control-btn:hover {
            background: #f5f5f5 !important;
            border-color: #000000 !important;
            color: #000000 !important;
        }

        .back-btn:hover {
            color: #000000 !important;
        }

        .swap-btn:hover {
            background: #f5f5f5 !important;
            border-color: #000000 !important;
            color: #000000 !important;
        }

        .team-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 16px;
        }

        .team-header .team-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .team-header .team-info .shield {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .team-header .team-info .shield img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .team-header .team-info .name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-header .team-info .overall {
            display: inline-block;
            padding: 0 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            line-height: 18px;
            background: #000;
            color: #fff;
            flex-shrink: 0;
        }

        .team-header .vs-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            padding: 0 16px;
        }

        .team-header .vs-area .vs {
            font-size: 14px;
            font-weight: 700;
            color: #999;
            letter-spacing: 2px;
        }

        .team-header .vs-area .swap-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #e0e0e0;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            transition: all 0.3s;
            font-size: 14px;
        }

        .team-header .vs-area .swap-btn:hover {
            background: #f5f5f5;
            border-color: #000;
            color: #000;
            transform: rotate(180deg);
        }

        .team-header .team-info-right {
            justify-content: flex-end;
            text-align: right;
        }

        .selection-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 10px;
        }

        .selection-row .label {
            font-size: 10px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            min-width: 70px;
            text-align: center;
        }

        .neutral-toggle-large {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #999;
            cursor: pointer;
            user-select: none;
            justify-content: center;
        }

        .neutral-toggle-large input[type="checkbox"] {
            width: 36px;
            height: 18px;
            appearance: none;
            background: #e0e0e0;
            border-radius: 9px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .neutral-toggle-large input[type="checkbox"]:checked {
            background: #000000;
        }

        .neutral-toggle-large input[type="checkbox"]::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .neutral-toggle-large input[type="checkbox"]:checked::before {
            left: 20px;
        }

        @media (max-width: 768px) {
            .team-header {
                flex-direction: column;
                gap: 8px;
                align-items: stretch;
            }
            .team-header .vs-area {
                flex-direction: row;
                justify-content: center;
                padding: 8px 0;
                border-top: 1px solid #f0f0f0;
                border-bottom: 1px solid #f0f0f0;
            }
            .selection-row {
                flex-wrap: wrap;
                gap: 8px;
            }
            .selection-row .label {
                min-width: 100%;
                text-align: left;
            }
            .team-header .team-info .name {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .team-header .vs-area {
                gap: 10px;
                flex-wrap: wrap;
            }
            .team-header .vs-area .vs {
                font-size: 12px;
            }
            .custom-select-button {
                font-size: 12px;
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <!-- Home Screen -->
    <div class="home-screen min-h-screen flex flex-col items-center justify-center p-5 relative" id="home-screen">
        <div class="logo-icon w-32 h-32 mb-6">
            <img src="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/rise.png" alt="Rise Football" class="w-full h-full object-contain">
        </div>
        <h1 class="text-6xl font-extrabold text-white mb-2 tracking-widest uppercase">RISE</h1>
        <p class="text-xl text-white/70 mb-12 tracking-wider" data-i18n="football_simulator">Football Simulator</p>
        <div class="flex flex-col gap-4 w-full max-w-xs">
            <button class="home-btn primary bg-white text-black px-8 py-4 text-lg border-none rounded-xl cursor-pointer transition-all duration-300 font-semibold flex items-center justify-center tracking-wide w-full hover:-translate-y-1 hover:shadow-2xl" data-i18n="simulate_match" onclick="showMatchTab()">Simulate Match</button>
            <button class="home-btn secondary bg-white/10 text-white border border-white/30 px-8 py-4 text-lg rounded-xl cursor-pointer transition-all duration-300 font-semibold flex items-center justify-center tracking-wide w-full hover:bg-white/20 hover:-translate-y-1 hover:shadow-2xl" data-i18n="team_editor" onclick="showTeamsTab()">Team Editor</button>
        </div>
        <!-- Language Selector -->
        <div class="absolute top-5 right-5 language-selector" id="language-selector">
            <button class="language-selector-button" id="language-selector-button" onclick="toggleDropdown('language-selector-dropdown', 'language-arrow')">
                <span id="current-language-display" style="display: flex; align-items: center; gap: 8px;"></span>
                <i class="fa-solid fa-chevron-down arrow" id="language-arrow"></i>
            </button>
            <div class="language-selector-dropdown" id="language-selector-dropdown"></div>
        </div>
        <div class="absolute bottom-5 text-white/40 text-sm tracking-wider">© Volcam Studios - v1.0.0</div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden">
        <div class="px-4 sm:px-6 lg:px-8 py-6">
            <!-- Teams Tab -->
            <div class="tab-content" id="teams-tab">
                <button class="back-btn bg-transparent border-none text-gray-500 text-2xl cursor-pointer p-2 transition-all duration-200 flex items-center gap-2 mb-6 hover:text-black" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                    <h2 class="text-xl font-semibold" data-i18n="teams">Teams</h2>
                    <div class="flex gap-2 flex-wrap">
                        <button class="bg-gray-500 text-white px-4 py-2 text-sm rounded-md cursor-pointer transition-all duration-200 font-medium inline-flex items-center gap-2 hover:bg-gray-600" data-i18n="data" onclick="showDataTab()"><i class="fa-solid fa-code"></i> Data</button>
                        <button class="bg-black text-white px-4 py-2 text-sm rounded-md cursor-pointer transition-all duration-200 font-medium inline-flex items-center gap-2 hover:bg-gray-800" data-i18n="new_team" onclick="showEditor()"><i class="fa-solid fa-plus"></i> New Team</button>
                    </div>
                </div>
                <div id="teams-list"></div>
            </div>

            <!-- Match Tab -->
            <div class="tab-content" id="match-tab">
                <div id="match-setup">
                    <button class="back-btn bg-transparent border-none text-gray-500 text-2xl cursor-pointer p-2 transition-all duration-200 flex items-center gap-2 mb-6 hover:text-black" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i></button>
                    
                    <!-- Team Header with VS and controls -->
                    <div class="team-header">
                        <div class="team-info" id="home-header">
                            <div class="shield" id="home-shield">🏠</div>
                            <span class="name" id="home-name">Home Team</span>
                            <span class="overall" id="home-overall" style="display:none;">0</span>
                        </div>
                        
                        <div class="vs-area">
                            <button class="swap-btn" onclick="swapTeams()" title="Swap teams">
                                <i class="fa-solid fa-right-left"></i>
                            </button>
                            <span class="vs">VS</span>
                        </div>
                        
                        <div class="team-info team-info-right" id="away-header">
                            <span class="overall" id="away-overall" style="display:none;">0</span>
                            <span class="name" id="away-name">Away Team</span>
                            <div class="shield" id="away-shield">🏠</div>
                        </div>
                    </div>

                    <!-- Selection Rows with shared labels -->
                    <div class="selection-row">
                        <div class="custom-select" id="home-continent-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('home-continent-dropdown', 'home-continent-arrow')">
                                <span class="selected-content" id="home-continent-display"><span class="selected-text">Select</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="home-continent-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="home-continent-dropdown"></div>
                        </div>
                        <span class="label" data-i18n="continent">Continent</span>
                        <div class="custom-select" id="away-continent-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('away-continent-dropdown', 'away-continent-arrow')">
                                <span class="selected-content" id="away-continent-display"><span class="selected-text">Select</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="away-continent-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="away-continent-dropdown"></div>
                        </div>
                    </div>

                    <div class="selection-row">
                        <div class="custom-select" id="home-country-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('home-country-dropdown', 'home-country-arrow')">
                                <span class="selected-content" id="home-country-display"><span class="selected-text">Select</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="home-country-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="home-country-dropdown"></div>
                        </div>
                        <span class="label" data-i18n="country">Country</span>
                        <div class="custom-select" id="away-country-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('away-country-dropdown', 'away-country-arrow')">
                                <span class="selected-content" id="away-country-display"><span class="selected-text">Select</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="away-country-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="away-country-dropdown"></div>
                        </div>
                    </div>

                    <div class="selection-row">
                        <div class="custom-select" id="home-division-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('home-division-dropdown', 'home-division-arrow')">
                                <span class="selected-content" id="home-division-display"><span class="selected-text">Select</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="home-division-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="home-division-dropdown"></div>
                        </div>
                        <span class="label" data-i18n="division">Division</span>
                        <div class="custom-select" id="away-division-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('away-division-dropdown', 'away-division-arrow')">
                                <span class="selected-content" id="away-division-display"><span class="selected-text">Select</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="away-division-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="away-division-dropdown"></div>
                        </div>
                    </div>

                    <div class="selection-row">
                        <div class="custom-select" id="home-team-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('home-team-dropdown', 'home-team-arrow')">
                                <span class="selected-content" id="home-team-display"><span class="selected-text">Select</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="home-team-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="home-team-dropdown"></div>
                        </div>
                        <span class="label" data-i18n="team">Team</span>
                        <div class="custom-select" id="away-team-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('away-team-dropdown', 'away-team-arrow')">
                                <span class="selected-content" id="away-team-display"><span class="selected-text">Select</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="away-team-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="away-team-dropdown"></div>
                        </div>
                    </div>

                    <div class="selection-row">
                        <div class="custom-select" id="home-tactic-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('home-tactic-dropdown', 'home-tactic-arrow')">
                                <span class="selected-content" id="home-tactic-display"><i class="fa-solid fa-robot"></i><span class="selected-text">Auto</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="home-tactic-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="home-tactic-dropdown"></div>
                        </div>
                        <span class="label" data-i18n="tactic">Tactic</span>
                        <div class="custom-select" id="away-tactic-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('away-tactic-dropdown', 'away-tactic-arrow')">
                                <span class="selected-content" id="away-tactic-display"><i class="fa-solid fa-robot"></i><span class="selected-text">Auto</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="away-tactic-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="away-tactic-dropdown"></div>
                        </div>
                    </div>

                    <div class="selection-row">
                        <div class="custom-select" id="home-pressure-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('home-pressure-dropdown', 'home-pressure-arrow')">
                                <span class="selected-content" id="home-pressure-display"><i class="fa-solid fa-robot"></i><span class="selected-text">Auto</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="home-pressure-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="home-pressure-dropdown"></div>
                        </div>
                        <span class="label" data-i18n="pressing">Pressing</span>
                        <div class="custom-select" id="away-pressure-custom">
                            <button class="custom-select-button" onclick="toggleDropdown('away-pressure-dropdown', 'away-pressure-arrow')">
                                <span class="selected-content" id="away-pressure-display"><i class="fa-solid fa-robot"></i><span class="selected-text">Auto</span></span>
                                <i class="fa-solid fa-chevron-down arrow" id="away-pressure-arrow"></i>
                            </button>
                            <div class="custom-select-dropdown" id="away-pressure-dropdown"></div>
                        </div>
                    </div>

                    <div class="text-center mt-6">
                        <div class="mb-3">
                            <label class="neutral-toggle-large">
                                <input type="checkbox" id="neutral-venue" onchange="toggleNeutralVenue()">
                                <span data-i18n="neutral_venue">Neutral Venue</span>
                            </label>
                        </div>
                        <button class="bg-black text-white px-8 py-3.5 text-sm rounded-xl cursor-pointer transition-all duration-200 font-medium inline-flex items-center gap-2 hover:bg-gray-800 hover:shadow-lg" data-i18n="start_match" onclick="startMatch()">
                            <i class="fa-solid fa-futbol"></i> Start Match
                        </button>
                    </div>
                </div>

                <!-- Match Live section remains the same -->
                <div id="match-live" class="hidden">
                    <!-- ... (same as before) ... -->
                </div>
            </div>

            <!-- Data Tab remains the same -->
            <div class="tab-content" id="data-tab">
                <!-- ... (same as before) ... -->
            </div>
        </div>
    </div>

    <!-- Modals remain the same -->
    <!-- ... -->

    <script>
        // ... (previous code) ...

        // Custom Dropdown System
        const customSelects = {};

        const initCustomSelect = (id, options, onSelect, defaultDisplay = null) => {
            customSelects[id] = {
                options: options,
                selected: null,
                onSelect: onSelect,
                defaultDisplay: defaultDisplay
            };
            renderCustomSelect(id);
        };

        const renderCustomSelect = (id) => {
            const select = customSelects[id];
            if (!select) return;
            
            const dropdown = document.getElementById(id + '-dropdown');
            const display = document.getElementById(id + '-display');
            if (!dropdown || !display) return;
            
            dropdown.innerHTML = '';
            
            select.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'custom-option';
                if (select.selected === option.value) {
                    div.classList.add('selected');
                }
                
                let iconHtml = '';
                if (option.icon) {
                    iconHtml = `<i class="fa-solid ${option.icon}"></i>`;
                } else if (option.image) {
                    iconHtml = `<img src="${option.image}" alt="${option.label}" onerror="this.style.display='none'">`;
                }
                
                div.innerHTML = `
                    ${iconHtml}
                    <span>${option.label}</span>
                    ${select.selected === option.value ? '<i class="fa-solid fa-check check"></i>' : ''}
                `;
                
                div.addEventListener('click', () => {
                    select.selected = option.value;
                    select.onSelect(option.value);
                    renderCustomSelect(id);
                    closeAllDropdowns();
                });
                
                dropdown.appendChild(div);
            });
            
            // Update display
            const selectedOption = select.options.find(o => o.value === select.selected);
            if (selectedOption) {
                let iconHtml = '';
                if (selectedOption.icon) {
                    iconHtml = `<i class="fa-solid ${selectedOption.icon}"></i>`;
                } else if (selectedOption.image) {
                    iconHtml = `<img src="${selectedOption.image}" alt="${selectedOption.label}" onerror="this.style.display='none'">`;
                }
                display.innerHTML = `${iconHtml}<span class="selected-text">${selectedOption.label}</span>`;
            } else if (select.defaultDisplay) {
                display.innerHTML = select.defaultDisplay;
            }
        };

        const toggleDropdown = (dropdownId, arrowId) => {
            const dropdown = document.getElementById(dropdownId);
            const arrow = document.getElementById(arrowId);
            if (!dropdown || !arrow) return;
            
            const isOpen = dropdown.classList.contains('open');
            
            // Close all dropdowns first
            closeAllDropdowns();
            
            if (!isOpen) {
                dropdown.classList.add('open');
                arrow.classList.add('open');
                // Also add open class to button
                const button = dropdown.previousElementSibling;
                if (button) button.classList.add('open');
            }
        };

        const closeAllDropdowns = () => {
            document.querySelectorAll('.custom-select-dropdown.open, .language-selector-dropdown.open').forEach(d => {
                d.classList.remove('open');
            });
            document.querySelectorAll('.arrow.open').forEach(a => {
                a.classList.remove('open');
            });
            document.querySelectorAll('.custom-select-button.open, .language-selector-button.open').forEach(b => {
                b.classList.remove('open');
            });
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-select') && !e.target.closest('.language-selector')) {
                closeAllDropdowns();
            }
        });

        // Update populate functions to use custom selects
        const populateFilterDropdowns = () => {
            const continents = getContinentsWithTeams();
            
            const homeContinentOptions = continents.length === 0 
                ? [{ value: '', label: t('no_teams_available') || 'No teams available' }]
                : continents.map(c => ({ value: c, label: c }));
            
            const awayContinentOptions = continents.length === 0 
                ? [{ value: '', label: t('no_teams_available') || 'No teams available' }]
                : continents.map(c => ({ value: c, label: c }));
            
            initCustomSelect('home-continent', homeContinentOptions, (value) => {
                updateHomeCountries();
            });
            
            initCustomSelect('away-continent', awayContinentOptions, (value) => {
                updateAwayCountries();
            });
            
            updateHomeCountries();
            updateAwayCountries();
        };

        const getCountryFlag = (countryName) => {
            // Search in countriesData
            for (const continent in countriesData) {
                const country = countriesData[continent].find(c => c.name === countryName);
                if (country && country.flag) return country.flag;
            }
            return null;
        };

        const updateHomeCountries = () => {
            const continent = customSelects['home-continent']?.selected;
            const options = [];
            
            if (continent) {
                getCountriesWithTeams(continent).forEach(c => {
                    options.push({
                        value: c,
                        label: c,
                        image: getCountryFlag(c)
                    });
                });
            }
            
            initCustomSelect('home-country', options, (value) => {
                updateHomeDivisions();
            }, `<span class="selected-text">Select</span>`);
            
            updateHomeDivisions();
        };

        const updateAwayCountries = () => {
            const continent = customSelects['away-continent']?.selected;
            const options = [];
            
            if (continent) {
                getCountriesWithTeams(continent).forEach(c => {
                    options.push({
                        value: c,
                        label: c,
                        image: getCountryFlag(c)
                    });
                });
            }
            
            initCustomSelect('away-country', options, (value) => {
                updateAwayDivisions();
            }, `<span class="selected-text">Select</span>`);
            
            updateAwayDivisions();
        };

        const updateHomeDivisions = () => {
            const continent = customSelects['home-continent']?.selected;
            const country = customSelects['home-country']?.selected;
            const options = [];
            
            if (continent && country) {
                const divisions = getDivisionsWithTeams(continent, country);
                divisions.forEach(d => {
                    options.push({
                        value: d,
                        label: getDivisionLabel(d)
                    });
                });
                if (divisions.length > 0) {
                    customSelects['home-division'] = customSelects['home-division'] || {};
                    customSelects['home-division'].selected = divisions[0];
                }
            }
            
            initCustomSelect('home-division', options, (value) => {
                updateHomeTeams();
            }, `<span class="selected-text">Select</span>`);
            
            // Set default selection
            if (options.length > 0 && !customSelects['home-division']?.selected) {
                customSelects['home-division'].selected = options[0].value;
            }
            
            updateHomeTeams();
        };

        const updateAwayDivisions = () => {
            const continent = customSelects['away-continent']?.selected;
            const country = customSelects['away-country']?.selected;
            const options = [];
            
            if (continent && country) {
                const divisions = getDivisionsWithTeams(continent, country);
                divisions.forEach(d => {
                    options.push({
                        value: d,
                        label: getDivisionLabel(d)
                    });
                });
                if (divisions.length > 0) {
                    customSelects['away-division'] = customSelects['away-division'] || {};
                    customSelects['away-division'].selected = divisions[0];
                }
            }
            
            initCustomSelect('away-division', options, (value) => {
                updateAwayTeams();
            }, `<span class="selected-text">Select</span>`);
            
            if (options.length > 0 && !customSelects['away-division']?.selected) {
                customSelects['away-division'].selected = options[0].value;
            }
            
            updateAwayTeams();
        };

        const updateHomeTeams = () => {
            const continent = customSelects['home-continent']?.selected;
            const country = customSelects['home-country']?.selected;
            const division = customSelects['home-division']?.selected;
            const options = [];
            
            teams.filter(t => {
                if (continent && t.continent !== continent) return false;
                if (country && t.country !== country) return false;
                if (division && (t.division || 1) != division) return false;
                return true;
            }).forEach(team => {
                const idx = teams.indexOf(team);
                options.push({
                    value: idx,
                    label: team.name,
                    image: team.shield || generateShieldUrl(team.abbreviation, team.colors?.[0] || '#000000', team.colors?.[1] || '#ffffff')
                });
            });
            
            initCustomSelect('home-team', options, (value) => {
                selectTeam('home');
            }, `<span class="selected-text">Select</span>`);
            
            if (options.length > 0) {
                customSelects['home-team'].selected = options[0].value;
                selectTeam('home');
            }
        };

        const updateAwayTeams = () => {
            const continent = customSelects['away-continent']?.selected;
            const country = customSelects['away-country']?.selected;
            const division = customSelects['away-division']?.selected;
            const options = [];
            
            teams.filter(t => {
                if (continent && t.continent !== continent) return false;
                if (country && t.country !== country) return false;
                if (division && (t.division || 1) != division) return false;
                return true;
            }).forEach(team => {
                const idx = teams.indexOf(team);
                options.push({
                    value: idx,
                    label: team.name,
                    image: team.shield || generateShieldUrl(team.abbreviation, team.colors?.[0] || '#000000', team.colors?.[1] || '#ffffff')
                });
            });
            
            initCustomSelect('away-team', options, (value) => {
                selectTeam('away');
            }, `<span class="selected-text">Select</span>`);
            
            if (options.length > 0) {
                customSelects['away-team'].selected = options[0].value;
                selectTeam('away');
            }
        };

        const populateTacticDropdowns = () => {
            const tacticOptions = TACTICS.map(t => ({
                value: t.id,
                label: t.name,
                icon: t.icon
            }));
            
            const pressureOptions = PRESSURE_LEVELS.map(p => ({
                value: p.id,
                label: p.name,
                icon: p.icon
            }));
            
            initCustomSelect('home-tactic', tacticOptions, (value) => {}, `<i class="fa-solid fa-robot"></i><span class="selected-text">Auto</span>`);
            initCustomSelect('away-tactic', tacticOptions, (value) => {}, `<i class="fa-solid fa-robot"></i><span class="selected-text">Auto</span>`);
            initCustomSelect('home-pressure', pressureOptions, (value) => {}, `<i class="fa-solid fa-robot"></i><span class="selected-text">Auto</span>`);
            initCustomSelect('away-pressure', pressureOptions, (value) => {}, `<i class="fa-solid fa-robot"></i><span class="selected-text">Auto</span>`);
            
            // Set defaults
            customSelects['home-tactic'].selected = 'auto';
            customSelects['away-tactic'].selected = 'auto';
            customSelects['home-pressure'].selected = 'auto';
            customSelects['away-pressure'].selected = 'auto';
            
            renderCustomSelect('home-tactic');
            renderCustomSelect('away-tactic');
            renderCustomSelect('home-pressure');
            renderCustomSelect('away-pressure');
        };

        const selectTeam = (side) => {
            const select = side === 'home' ? customSelects['home-team'] : customSelects['away-team'];
            if (!select || select.selected === null || select.selected === undefined) return;
            
            const idx = select.selected;
            const team = teams[idx];
            if (!team) return;
            
            const nameEl = side === 'home' ? elements.homeName : elements.awayName;
            const shieldEl = side === 'home' ? elements.homeShield : elements.awayShield;
            const overallEl = side === 'home' ? elements.homeOverall : elements.awayOverall;
            
            nameEl.textContent = team.name;
            const shieldUrl = team.shield || generateShieldUrl(team.abbreviation, team.colors?.[0] || '#000000', team.colors?.[1] || '#ffffff');
            shieldEl.innerHTML = `<img src="${shieldUrl}" alt="${team.abbreviation}" class="w-full h-full object-contain">`;
            const overall = calculateTeamOverall(team);
            overallEl.textContent = overall;
            overallEl.style.display = 'inline-block';
            overallEl.style.backgroundColor = team.colors?.[0] || '#000000';
            overallEl.style.color = team.colors?.[1] || '#ffffff';
        };

        const startMatch = async () => {
            const hi = customSelects['home-team']?.selected;
            const ai = customSelects['away-team']?.selected;
            
            if (!hi || !ai || hi === '' || ai === '') {
                showToast(t('select_both_teams') || 'Select both teams to start the match!', 'error');
                return;
            }
            if (hi === ai) {
                showToast(t('teams_must_differ') || 'Teams must be different!', 'error');
                return;
            }
            
            const homeTeam = teams[hi], awayTeam = teams[ai];
            
            let homeTactic = customSelects['home-tactic']?.selected || 'auto';
            let awayTactic = customSelects['away-tactic']?.selected || 'auto';
            let homePressure = customSelects['home-pressure']?.selected || 'auto';
            let awayPressure = customSelects['away-pressure']?.selected || 'auto';
            
            // ... (rest of startMatch remains the same)
        };

        const swapTeams = () => {
            const hc = customSelects['home-continent']?.selected;
            const ac = customSelects['away-continent']?.selected;
            const hco = customSelects['home-country']?.selected;
            const aco = customSelects['away-country']?.selected;
            const hdi = customSelects['home-division']?.selected;
            const adi = customSelects['away-division']?.selected;
            const ht = customSelects['home-team']?.selected;
            const at = customSelects['away-team']?.selected;
            
            // Swap values
            if (customSelects['home-continent']) customSelects['home-continent'].selected = ac;
            if (customSelects['away-continent']) customSelects['away-continent'].selected = hc;
            
            updateHomeCountries();
            updateAwayCountries();
            
            if (customSelects['home-country']) customSelects['home-country'].selected = aco;
            if (customSelects['away-country']) customSelects['away-country'].selected = hco;
            
            updateHomeDivisions();
            updateAwayDivisions();
            
            if (customSelects['home-division']) customSelects['home-division'].selected = adi;
            if (customSelects['away-division']) customSelects['away-division'].selected = hdi;
            
            updateHomeTeams();
            updateAwayTeams();
            
            if (customSelects['home-team']) customSelects['home-team'].selected = at;
            if (customSelects['away-team']) customSelects['away-team'].selected = ht;
            
            selectTeam('home');
            selectTeam('away');
        };

        // ... (rest of the code including celebration, simulation, etc.)
        
        // Update toggleDropdown to be globally accessible
        window.toggleDropdown = toggleDropdown;
        
        // Initialize
        (async () => {
            const savedLanguage = localStorage.getItem('rise_language') || 'en';
            currentLanguage = savedLanguage;
            await Promise.all([loadReferees(), loadCountries()]);
            await discoverAvailableLanguages();
            await loadTranslations(currentLanguage);
            loadTeams();
        })();
    </script>
</body>
